name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Build web assets and sync
        run: npm run android:sync
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK for distribution
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AevMotion.apk
      - name: Create installation ZIP package
        run: |
          mkdir -p package
          cp AevMotion.apk package/AevMotion.apk
          cp android-package/利用規約.txt package/利用規約.txt
          cp android-package/使い方ガイド.txt package/使い方ガイド.txt
          cp android-package/README.txt package/README.txt
          cd package
          zip -9 ../AevMotion-Android-Install.zip ./*
      - name: Upload Android installation package
        uses: actions/upload-artifact@v4
        with:
          name: AevMotion-Android-Install
          path: AevMotion-Android-Install.zip
          if-no-files-found: error
      - name: Publish latest APK for direct download
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AevMotion Latest APK
          target_commitish: ${{ github.sha }}
          files: AevMotion-Android-Install.zip
          overwrite_files: true
          make_latest: true
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AevMotion-Android-Install.zip
          generate_release_notes: true